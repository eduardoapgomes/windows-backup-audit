name: Windows tests
on: [push, pull_request, workflow_dispatch]
# Evita gastar runners com commits intermediários da mesma branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: PowerShell 5.1 integration tests
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -CI

      - name: Read-only hierarchy analysis tests
        shell: powershell
        run: python -m unittest discover -s tests -p "test_*.py" -v
